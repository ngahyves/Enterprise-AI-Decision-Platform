version: 1

# -----------------------------
# FORMATTERS
# -----------------------------
formatters:
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: >
      timestamp=%(asctime)s
      level=%(levelname)s
      logger=%(name)s
      message=%(message)s
      module=%(module)s
      function=%(funcName)s
      line=%(lineno)d

  simple:
    format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"

# -----------------------------
# HANDLERS
# -----------------------------
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/app.json
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  error_console:
    class: logging.StreamHandler
    level: ERROR
    formatter: json
    stream: ext://sys.stderr

# -----------------------------
# ROOT LOGGER
# -----------------------------
root:
  level: INFO
  handlers: [console, file]

# -----------------------------
# APP LOGGERS
# -----------------------------
loggers:
  app:
    level: INFO
    handlers: [console, file]
    propagate: False

  app.api:
    level: INFO
    handlers: [console, file]
    propagate: False

  app.core:
    level: INFO
    handlers: [console, file]
    propagate: False

  app.schemas:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.ingestion:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.retrieval:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.generation:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.agents:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.finetuning:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.evaluation:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.observability:
    level: INFO
    handlers: [console, file]
    propagate: False

  src.common:
    level: INFO
    handlers: [console, file]
    propagate: False