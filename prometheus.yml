global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ai-enterprise-assistant

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ai-enterprise-assistant-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "rag-api"
          env: "dev"

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]   